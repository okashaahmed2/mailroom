readme = "README.md"
authors = [
    { name = "Okasha ahmed" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mailroom = "mailroom:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"
